<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo produto | Mais Que Café</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background-color: #F5EFE6;
            color: #4B2E2B;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 480px);
            padding: 32px;
            background-color: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(75, 46, 43, 0.15);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        main > p {
            margin-bottom: 24px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            margin-top: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #B9A69A;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
        }

        button {
            margin-top: 14px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #4B2E2B;
            color: #FFFFFF;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #E67E22;
        }

        .cancelar {
            margin-top: 8px;
            color: #4B2E2B;
            text-align: center;
        }

        .mensagem-erro {
            padding: 10px;
            border-radius: 6px;
            background-color: #FDECEC;
            color: #9B1C1C;
        }
    </style>
</head>

<body>
    <main>
        <h1>Novo produto</h1>
        <p>Preencha os dados para cadastrar.</p>

        {% if erro %}
            <p class="mensagem-erro">{{ erro }}</p>
        {% endif %}

        <form method="post">
            <label for="nome">Nome</label>
            <input
                id="nome"
                name="nome"
                type="text"
                required
            >

            <label for="descricao">Descrição</label>
            <textarea
                id="descricao"
                name="descricao"
                rows="3"
            ></textarea>

            <label for="preco">Preço</label>
            <input
                id="preco"
                name="preco"
                type="number"
                min="0.01"
                step="0.01"
                placeholder="Ex.: 5,00"
                required
            >

            <label for="categoria">Categoria</label>
            <input
                id="categoria"
                name="categoria"
                type="text"
            >

            <button type="submit">Salvar produto</button>

            <a class="cancelar" href="{{ url_for('listar_produtos') }}">
                Cancelar
            </a>
        </form>
    </main>
</body>
</html>
