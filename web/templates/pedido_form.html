<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo pedido | Mais Que Café</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background-color: #F5EFE6;
            color: #4B2E2B;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 700px);
            padding: 32px;
            background-color: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(75, 46, 43, 0.15);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitulo {
            margin-bottom: 24px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            margin-top: 6px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #B9A69A;
            border-radius: 6px;
            background-color: #FFFFFF;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }

        .itens {
            margin-top: 12px;
            padding: 18px;
            border: 1px solid #D8C9BC;
            border-radius: 8px;
        }

        .itens h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .linha-item {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        button {
            margin-top: 14px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #4B2E2B;
            color: #FFFFFF;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #E67E22;
        }

        .cancelar {
            margin-top: 8px;
            color: #4B2E2B;
            text-align: center;
        }

        .mensagem-erro {
            padding: 10px;
            border-radius: 6px;
            background-color: #FDECEC;
            color: #9B1C1C;
        }

        @media (max-width: 600px) {
            main {
                padding: 22px;
            }

            .linha-item {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Novo pedido</h1>
        <p class="subtitulo">Selecione o cliente e os produtos do pedido.</p>

        {% if erro %}
            <p class="mensagem-erro">{{ erro }}</p>
        {% endif %}

        <form method="post">
            <label for="id_cliente">Cliente</label>
            <select id="id_cliente" name="id_cliente" required>
                <option value="">Selecione um cliente</option>
                {% for cliente in clientes %}
                    <option value="{{ cliente[0] }}">
                        {{ cliente[0] }} — {{ cliente[1] }}
                    </option>
                {% endfor %}
            </select>

            <section class="itens">
                <h2>Produtos do pedido</h2>

                {% for numero in range(1, 6) %}
                    <div class="linha-item">
                        <div>
                            <label for="id_produto_{{ numero }}">
                                Produto {{ numero }}
                            </label>
                            <select
                                id="id_produto_{{ numero }}"
                                name="id_produto_{{ numero }}"
                            >
                                <option value="">Selecione um produto</option>
                                {% for produto in produtos %}
                                    <option value="{{ produto[0] }}">
                                        {{ produto[1] }} — R$ {{ "%.2f"|format(produto[2]) }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div>
                            <label for="quantidade_{{ numero }}">Quantidade</label>
                            <input
                                id="quantidade_{{ numero }}"
                                name="quantidade_{{ numero }}"
                                type="number"
                                min="1"
                                step="1"
                            >
                        </div>
                    </div>
                {% endfor %}
            </section>

            <label for="tipo_pagamento">Forma de pagamento</label>
            <select id="tipo_pagamento" name="tipo_pagamento" required>
                <option value="">Selecione</option>
                <option value="PIX">PIX</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Cartão de débito">Cartão de débito</option>
                <option value="Cartão de crédito">Cartão de crédito</option>
            </select>

            <label for="endereco">Endereço de entrega (opcional)</label>
            <input
                id="endereco"
                name="endereco"
                type="text"
                placeholder="Preencha se o pedido for para entrega"
            >

            <button type="submit">Salvar pedido</button>

            <a class="cancelar" href="{{ url_for('listar_pedidos') }}">
                Cancelar e voltar aos pedidos
            </a>
        </form>
    </main>
</body>
</html>
