<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes | Mais Que Café</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        main.pagina-clientes {
            display: block;
            max-width: 1100px;
            margin: 24px auto;
            padding: 24px;
            text-align: left;
            background: #FFFCF8;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(75, 46, 43, .12);
        }
        .pagina-clientes > p { margin: 12px 0 20px; }
        .pagina-clientes .acoes-cliente { white-space: nowrap; }
        .pagina-clientes .acoes-cliente form { display: inline; margin: 0; }
        .pagina-clientes .botao-acao {
            display: inline-block;
            margin: 2px;
            padding: 8px 12px;
            border: 0;
            border-radius: 5px;
            background: #4B2E2B;
            color: #FFF;
            font: inherit;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .pagina-clientes .botao-acao:hover { background: #E67E22; }
        .pagina-clientes .botao-excluir { background: #8F332B; }
        @media (max-width: 700px) {
            main.pagina-clientes { margin: 12px; padding: 14px; overflow-x: auto; }
            .pagina-clientes table { min-width: 650px; }
        }
    </style>
</head>
<body>
    <main class="pagina-clientes">
        <h1>Clientes</h1>
        <p>Consulte os clientes cadastrados.</p>

        {% if erro %}
            <p class="mensagem erro">{{ erro }}</p>
        {% endif %}

        <p>
            <a href="{{ url_for('novo_cliente') }}">Novo cliente</a>
        </p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for cliente in clientes %}
                    <tr>
                        <td>{{ cliente[0] }}</td>
                        <td>{{ cliente[1] }}</td>
                        <td>{{ cliente[2] }}</td>
                        <td>{{ cliente[3] or "—" }}</td>
                        <td class="acoes-cliente">
                            <a class="botao-acao" href="{{ url_for('editar_cliente', id_cliente=cliente[0]) }}">Editar</a>
                            <form method="post" action="{{ url_for('excluir_cliente', id_cliente=cliente[0]) }}" onsubmit="return confirm('Tem certeza que deseja excluir este cliente?');">
                                <button class="botao-acao botao-excluir" type="submit">Excluir</button>
                            </form>
                        </td>
                    </tr>
                {% else %}
                    <tr>
                        <td colspan="5">Nenhum cliente cadastrado.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>
</body>
</html>
